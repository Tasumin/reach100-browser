<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>100 Level Rush</title>
<style>
  :root{--bg:#080b14;--panel:#12182a;--text:#f6f7fb;--muted:#98a2bd;--accent:#7cf5ff;--accent2:#b375ff;--danger:#ff5470;--good:#55f29a}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -20%,#1f2d59 0,#0c1020 36%,#050710 75%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  body{display:grid;place-items:center;padding:12px;touch-action:none;user-select:none}
  #shell{width:min(100%,520px);height:min(96vh,920px);min-height:580px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
  .brand{font-weight:900;letter-spacing:.08em;font-size:clamp(18px,4vw,24px)} .brand b{color:var(--accent)}
  .pill{background:#ffffff12;border:1px solid #ffffff1c;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:12px;font-weight:700}
  #gameWrap{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;border:1px solid #ffffff20;background:#0b1020;box-shadow:0 22px 70px #0008, inset 0 0 50px #7cf5ff08}
  canvas{width:100%;height:100%;display:block;background:linear-gradient(#17243c,#0b1326 58%,#0b1020)}
  #hud{position:absolute;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
  .hudTop{display:flex;justify-content:space-between;align-items:flex-start}.hudCard{background:#07101ecf;border:1px solid #ffffff1a;backdrop-filter:blur(8px);border-radius:15px;padding:9px 12px;box-shadow:0 8px 30px #0004}.hudBig{font-size:22px;font-weight:900;line-height:1}.hudSmall{font-size:10px;letter-spacing:.14em;color:#aeb8ce;font-weight:800;margin-top:4px}
  #progressOuter{height:8px;border-radius:999px;background:#ffffff14;overflow:hidden;width:150px;margin-top:8px}#progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
  .hint{text-align:center;color:#eafcffb8;font-weight:800;font-size:12px;text-shadow:0 2px 10px #000;transition:.2s opacity}
  #overlay{position:absolute;inset:0;background:#050916d9;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:4}
  .panel{width:100%;max-width:390px;background:linear-gradient(180deg,#18223aee,#0d1426ee);border:1px solid #ffffff20;border-radius:28px;padding:26px;box-shadow:0 30px 90px #000b;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:900;text-transform:uppercase}.title{font-size:clamp(34px,8vw,52px);line-height:.95;font-weight:1000;margin:8px 0 12px;letter-spacing:-.04em}.subtitle{color:var(--muted);line-height:1.5;font-size:14px;margin:0 auto 22px;max-width:310px}
  button{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,var(--accent),#8fa9ff 55%,var(--accent2));color:#07101d;box-shadow:0 10px 28px #5de9ff3d}.secondary{background:#ffffff10;color:white;border:1px solid #ffffff18}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}
  #levelGrid{display:none;grid-template-columns:repeat(5,1fr);gap:7px;max-height:340px;overflow:auto;margin-top:18px;padding-right:4px}.lvl{aspect-ratio:1;padding:0;border-radius:12px;background:#ffffff0c;color:#7d879f;border:1px solid #ffffff0c;font-size:12px}.lvl.open{background:#ffffff12;color:white;border-color:#ffffff20}.lvl.done{background:#56f29b24;color:#8ff9bc;border-color:#55f29a50}.lvl.current{outline:2px solid var(--accent)}
  footer{display:flex;gap:8px;align-items:center;justify-content:center}.kbd{font-size:11px;color:#aeb8ce;background:#ffffff0b;border:1px solid #ffffff14;border-radius:10px;padding:7px 10px}
  @media (max-width:560px){body{padding:0}#shell{width:100%;height:100%;min-height:0;gap:0}header,footer{display:none}#gameWrap{border-radius:0;border:0}}
</style>
</head>
<body>
<div id="shell">
  <header><div class="brand">100 LEVEL <b>RUSH</b></div><div class="pill">100 micro-levels</div></header>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hudTop">
        <div class="hudCard"><div class="hudBig" id="levelText">1</div><div class="hudSmall">LEVEL</div></div>
        <div class="hudCard" style="text-align:right"><div class="hudBig" id="bestText">0</div><div class="hudSmall">BEST</div><div id="progressOuter"><div id="progress"></div></div></div>
      </div>
      <div class="hint" id="hint">TAP / SPACE TO JUMP · HOLD FOR HIGHER</div>
    </div>
    <div id="overlay">
      <div class="panel" id="panel">
        <div class="eyebrow">Original browser arcade</div>
        <div class="title">REACH<br><span style="color:var(--accent)">LEVEL 100</span></div>
        <p class="subtitle">One control. Tiny stages. Instant retries. Every few levels, the rules get meaner.</p>
        <button class="primary" id="playBtn">PLAY LEVEL 1</button>
        <div class="row"><button class="secondary" id="selectBtn">LEVEL SELECT</button><button class="secondary" id="resetBtn">RESET SAVE</button></div>
        <div id="levelGrid"></div>
      </div>
    </div>
  </div>
  <footer><div class="kbd">SPACE / CLICK / TAP = jump</div><div class="kbd">R = restart</div><div class="kbd">ESC = menu</div></footer>
</div>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),playBtn=document.getElementById('playBtn'),selectBtn=document.getElementById('selectBtn'),resetBtn=document.getElementById('resetBtn'),levelGrid=document.getElementById('levelGrid');
  const levelText=document.getElementById('levelText'),bestText=document.getElementById('bestText'),progress=document.getElementById('progress'),hint=document.getElementById('hint');
  let W=420,H=760,dpr=1,last=0,state='menu',level=1,unlocked=Number(localStorage.getItem('rushUnlocked')||1),deaths=0;
  let player, platforms=[], spikes=[], movers=[], goal, particles=[], cameraX=0, levelWidth=1200, t=0, jumpHeld=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rand=(seed)=>{let x=Math.sin(seed*999.917)*43758.5453;return x-Math.floor(x)};

  function resize(){
    const r=canvas.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize); resize();

  function levelTheme(n){
    const zones=[['#15253d','#0a1223','#7cf5ff'],['#24153b','#110a22','#d383ff'],['#351b24','#170b12','#ff7f91'],['#17352d','#0b1815','#64f0b2'],['#3b3117','#1b1508','#ffd66b']];
    return zones[Math.floor((n-1)/20)%zones.length];
  }

  function buildLevel(n){
    platforms=[];spikes=[];movers=[];particles=[];cameraX=0;t=0;
    const difficulty=(n-1)/99;
    const baseY=H*0.76;
    levelWidth=1000 + Math.floor(n/8)*50 + (n%5)*35;
    platforms.push({x:-50,y:baseY,w:260,h:120});
    let x=210; let py=baseY;
    const chunks=7+Math.floor(n/12);
    for(let i=0;i<chunks;i++){
      const r=rand(n*31+i*17);
      let gap=45+Math.floor(30*difficulty)+Math.floor(r*40);
      if(n<4) gap=35+i*2;
      const w=90+Math.floor(rand(n*71+i)*95);
      const dy=(rand(n*19+i*13)-.5)*(n<6?35:110);
      py=clamp(py+dy,H*.42,H*.82);
      if(i===chunks-1) py=baseY-20;
      const moving=n>12 && i%4===2 && rand(n+i)>.35;
      if(moving){
        const vertical=n>35 && rand(n*7+i)>.5;
        movers.push({x:x+gap,y:py,w,h:20,baseX:x+gap,baseY:py,amp:vertical?45:55,speed:.8+rand(n+i*9)*1.2,vertical,phase:rand(n*3+i)*6.28});
      } else platforms.push({x:x+gap,y:py,w,h:20});
      if(n>3 && i>0 && rand(n*101+i*5) < .28 + difficulty*.28){
        const count=1+Math.floor(rand(n*41+i)*Math.min(4,1+n/30));
        spikes.push({x:x+gap+w*.34,y:py-16,w:18*count,h:16,count});
      }
      x += gap+w;
    }
    platforms.push({x:x+55,y:baseY-10,w:230,h:120});
    goal={x:x+145,y:baseY-72,w:42,h:62}; levelWidth=goal.x+160;
    player={x:60,y:baseY-44,w:28,h:40,vx:0,vy:0,onGround:false,coyote:0,dead:false,win:false,trail:[]};
    updateHud();
  }

  function updateHud(){levelText.textContent=level;bestText.textContent=Math.max(0,unlocked-1);progress.style.width=((level-1)/99*100)+'%';}
  function startLevel(n=level){level=clamp(n,1,100);buildLevel(level);overlay.style.display='none';state='play';hint.style.opacity='1';setTimeout(()=>hint.style.opacity='.3',1800);}
  function die(){if(player.dead||player.win)return;player.dead=true;deaths++;burst(player.x+14,player.y+20,'#ff5470',24);setTimeout(()=>{if(state==='play')startLevel(level)},430);}
  function win(){if(player.win)return;player.win=true;burst(goal.x+21,goal.y+25,'#7cf5ff',40); if(level===unlocked && unlocked<101){unlocked=level+1;localStorage.setItem('rushUnlocked',unlocked)} updateHud(); setTimeout(()=>{ if(level>=100){showWinMenu()} else startLevel(level+1)},620);}
  function showMenu(){state='menu';overlay.style.display='flex';levelGrid.style.display='none';playBtn.textContent='PLAY LEVEL '+Math.min(unlocked,100);level=Math.min(unlocked,100);renderGrid();}
  function showWinMenu(){state='menu';overlay.style.display='flex';panel.innerHTML=`<div class="eyebrow">100 / 100</div><div class="title">YOU<br><span style="color:var(--good)">MADE IT.</span></div><p class="subtitle">All 100 stages cleared. Deaths this session: <b style="color:white">${deaths}</b></p><button class="primary" id="again">PLAY AGAIN</button><div class="row"><button class="secondary" id="levels">LEVEL SELECT</button></div>`;document.getElementById('again').onclick=()=>startLevel(1);document.getElementById('levels').onclick=()=>location.reload();}

  function jump(){
    if(state==='menu'){startLevel(Math.min(unlocked,100));return}
    if(state!=='play'||player.dead||player.win)return;
    jumpHeld=true;
    if(player.onGround||player.coyote>0){player.vy=-520;player.onGround=false;player.coyote=0;burst(player.x+14,player.y+38,'#7cf5ff',7)}
  }
  function releaseJump(){jumpHeld=false;if(player&&player.vy<-250)player.vy=-250}
  addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()} if(e.code==='KeyR'&&state==='play')startLevel(level); if(e.code==='Escape')showMenu()});
  addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))releaseJump()});
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});canvas.addEventListener('pointerup',releaseJump);canvas.addEventListener('pointercancel',releaseJump);

  function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
  function burst(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.7)*260,life:.45+Math.random()*.45,size:2+Math.random()*4,color})}

  function update(dt){
    if(state!=='play')return;t+=dt;
    for(const m of movers){if(m.vertical)m.y=m.baseY+Math.sin(t*m.speed+m.phase)*m.amp;else m.x=m.baseX+Math.sin(t*m.speed+m.phase)*m.amp}
    if(!player.dead&&!player.win){
      const speed=185+Math.min(115,level*1.15);player.vx=speed;player.vy+=1350*dt;if(jumpHeld&&player.vy<0)player.vy-=210*dt;
      const oldY=player.y;player.x+=player.vx*dt;player.y+=player.vy*dt;player.onGround=false;
      const all=platforms.concat(movers);
      for(const p of all){
        if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+5&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
      }
      if(player.onGround)player.coyote=.095; else player.coyote=Math.max(0,player.coyote-dt);
      for(const s of spikes){if(rectHit(player,{x:s.x,y:s.y+3,w:s.w,h:s.h-3}))die()}
      if(player.y>H+80)die();
      if(rectHit(player,goal))win();
      player.trail.push({x:player.x+3,y:player.y+20,life:.24});if(player.trail.length>12)player.trail.shift();
      cameraX+=(clamp(player.x-W*.28,0,Math.max(0,levelWidth-W))-cameraX)*Math.min(1,dt*6);
    }
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt}
    particles=particles.filter(p=>p.life>0);
    for(const q of player.trail||[])q.life-=dt; player.trail=(player.trail||[]).filter(q=>q.life>0);
  }

  function drawSpike(s,ox){ctx.fillStyle='#ff5470';const n=s.count||1,sw=s.w/n;for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(s.x-cameraX+ox+i*sw,s.y+s.h);ctx.lineTo(s.x-cameraX+ox+i*sw+sw/2,s.y);ctx.lineTo(s.x-cameraX+ox+(i+1)*sw,s.y+s.h);ctx.closePath();ctx.fill()}}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function draw(){
    const th=levelTheme(level);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th[0]);g.addColorStop(1,th[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.22;ctx.fillStyle=th[2];for(let i=0;i<25;i++){let sx=((i*97 - cameraX*.08)%(W+100)+W+100)%(W+100)-50;let sy=(i*131)%Math.floor(H*.62);ctx.fillRect(sx,sy,2+(i%3===0),2+(i%3===0))}ctx.globalAlpha=1;
    ctx.globalAlpha=.16;ctx.fillStyle='#fff';for(let i=0;i<14;i++){let bx=((i*86-cameraX*.18)%(W+120)+W+120)%(W+120)-60;let bh=40+(i*37)%130;ctx.fillRect(bx,H*.76-bh,50,bh)}ctx.globalAlpha=1;
    const fog=ctx.createLinearGradient(0,H*.55,0,H);fog.addColorStop(0,'#0000');fog.addColorStop(1,'#0008');ctx.fillStyle=fog;ctx.fillRect(0,H*.55,W,H*.45);
    for(const p of platforms){const x=p.x-cameraX;ctx.fillStyle='#dbe7ff';ctx.globalAlpha=.94;roundRect(x,p.y,p.w,p.h,9);ctx.globalAlpha=.16;ctx.fillStyle=th[2];ctx.fillRect(x,p.y,p.w,4);ctx.globalAlpha=1}
    for(const p of movers){const x=p.x-cameraX;ctx.fillStyle='#ffe58a';roundRect(x,p.y,p.w,p.h,9);ctx.fillStyle='#fff7';ctx.fillRect(x+9,p.y+4,p.w-18,2)}
    for(const s of spikes)drawSpike(s,0);
    const gx=goal.x-cameraX, pulse=1+Math.sin(t*5)*.08;ctx.save();ctx.translate(gx+21,goal.y+31);ctx.scale(pulse,pulse);ctx.shadowBlur=24;ctx.shadowColor=th[2];ctx.strokeStyle=th[2];ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,0,19,29,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffffff22';ctx.fill();ctx.restore();
    for(const q of player.trail||[]){ctx.globalAlpha=Math.max(0,q.life/0.24)*.32;ctx.fillStyle=th[2];roundRect(q.x-cameraX-4,q.y-8,20,16,8)}ctx.globalAlpha=1;
    const px=player.x-cameraX,py=player.y;ctx.save();ctx.translate(px+14,py+20);ctx.rotate(clamp(player.vy/900,-.25,.25));ctx.fillStyle=player.dead?'#ff5470':'#fff';ctx.shadowBlur=player.dead?18:14;ctx.shadowColor=player.dead?'#ff5470':th[2];roundRect(-14,-20,28,40,9);ctx.shadowBlur=0;ctx.fillStyle='#11182a';ctx.fillRect(3,-9,5,5);ctx.restore();
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,p.size,p.size)}ctx.globalAlpha=1;
    ctx.fillStyle='#ffffff20';ctx.font='900 86px system-ui';ctx.fillText(String(level).padStart(2,'0'),20-cameraX*.04,H*.3);
  }
  function loop(ts){const dt=Math.min(.028,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

  function renderGrid(){levelGrid.innerHTML='';for(let i=1;i<=100;i++){const b=document.createElement('button');b.className='lvl '+(i<unlocked?'done ':i===unlocked?'open current ':i<unlocked?'open ':'')+(i<=unlocked?'open':'');b.textContent=i;b.disabled=i>unlocked;b.onclick=()=>startLevel(i);levelGrid.appendChild(b)}}
  playBtn.onclick=()=>startLevel(Math.min(unlocked,100));selectBtn.onclick=()=>{levelGrid.style.display=levelGrid.style.display==='grid'?'none':'grid';renderGrid()};resetBtn.onclick=()=>{if(confirm('Reset all level progress?')){localStorage.removeItem('rushUnlocked');unlocked=1;showMenu()}};
  buildLevel(1);renderGrid();playBtn.textContent='PLAY LEVEL '+Math.min(unlocked,100);
})();
</script>
</body>
</html>
