<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>100 Level Hunt</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07130d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
*{box-sizing:border-box}body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,520px);height:100vh;max-height:940px;background:#0d1c13;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stats{display:grid;gap:4px;font-weight:800;font-size:13px;text-shadow:0 2px 4px #000}
.stat{display:flex;align-items:center;gap:7px}.ico{width:16px;text-align:center}
.objective{position:absolute;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));width:190px;text-align:center}
.objTitle{background:#8f2330;padding:8px 14px;border-radius:3px;font-size:12px;font-weight:900;box-shadow:0 4px 10px #0005}
.objSub{margin-top:5px;font-size:10px;font-weight:800;color:#ddd}.checks{margin-top:3px;display:flex;justify-content:center;gap:5px}.check{width:22px;height:20px;border-radius:4px;background:#326d35;border:1px solid #72c26f;display:grid;place-items:center;font-weight:1000}
.level{position:absolute;right:14px;top:90px;background:#26170d;border:2px solid #9f6f30;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:10px;font-weight:900;line-height:1;text-align:center}
#msg{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);font-size:32px;font-weight:1000;text-shadow:0 4px 10px #000;opacity:0;transition:.2s}
#overlay{position:absolute;inset:0;background:#06100bdb;display:grid;place-items:center;padding:26px;z-index:5}
.panel{width:100%;max-width:390px;background:linear-gradient(180deg,#1b2e22,#0e1c14);border:1px solid #ffffff20;border-radius:26px;padding:24px;text-align:center;box-shadow:0 30px 90px #000b}
.eyebrow{font-size:11px;letter-spacing:.2em;color:#77e69a;font-weight:900}.title{font-size:44px;line-height:.95;font-weight:1000;margin:8px 0 12px}.sub{color:#b2c1b6;line-height:1.5;font-size:14px}
button{border:0;border-radius:15px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,#ffd468,#f39f43);color:#2b1705;margin-top:16px}.secondary{width:100%;margin-top:9px;background:#ffffff10;color:white;border:1px solid #ffffff1d}
#upgradeCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);background:#102016f2;border:1px solid #ffffff25;border-radius:22px;padding:18px;display:none;z-index:4;box-shadow:0 25px 80px #000c}
#upgradeCard h3{margin:0 0 6px;text-align:center}.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.up{background:#ffffff0c;border:1px solid #ffffff18;border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;font-weight:800}.up b{display:block;font-size:22px;margin-bottom:5px}
#joy{position:absolute;left:34px;bottom:max(28px,env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff12;pointer-events:none}
#stick{position:absolute;width:38px;height:38px;border-radius:50%;background:#ffffff25;left:25px;top:25px;border:1px solid #ffffff2a}
#skill{position:absolute;right:22px;bottom:max(36px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#7b4b18,#2b1709);border:3px solid #c38b3e;display:grid;place-items:center;font-size:11px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="stats">
      <div class="stat"><span class="ico">🪙</span><span id="coins">0</span></div>
      <div class="stat"><span class="ico">💎</span><span id="gems">0</span></div>
      <div class="stat"><span class="ico">📦</span><span id="chests">0</span></div>
      <div class="stat"><span class="ico">💀</span><span id="kills">0</span></div>
    </div>
    <div class="objective">
      <div class="objTitle">Kill Them All</div>
      <div class="objSub">Stage Treasures</div>
      <div class="checks"><div class="check" id="c1">✓</div><div class="check" id="c2">✓</div><div class="check" id="c3">✓</div></div>
    </div>
    <div style="width:54px"></div>
  </div>
  <div class="level" id="levelBadge">LV<br>1</div>
  <div id="msg">LEVEL CLEAR</div>
  <div id="joy"><div id="stick"></div></div>
  <div id="skill">SKILL</div>
</div>
<div id="upgradeCard">
  <h3>Choose Upgrade</h3>
  <div class="sub" style="text-align:center;margin-bottom:12px">Pick one and keep fighting.</div>
  <div class="upgrades">
    <button class="up" data-up="damage"><b>⚔️</b>Damage +25%</button>
    <button class="up" data-up="range"><b>🌀</b>Blade Range +20%</button>
    <button class="up" data-up="speed"><b>👟</b>Move Speed +15%</button>
  </div>
</div>
<div id="overlay">
  <div class="panel">
    <div class="eyebrow">TOP-DOWN SURVIVAL</div>
    <div class="title">REACH<br><span style="color:#ffd468">LEVEL 100</span></div>
    <div class="sub">Move with the joystick or WASD. Your spinning weapon attacks automatically. Clear enemies, grab rewards, and upgrade as stages get harder.</div>
    <button class="primary" id="play">PLAY LEVEL 1</button>
    <button class="secondary" id="reset">RESET PROGRESS</button>
  </div>
</div>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ov=document.getElementById('overlay'),play=document.getElementById('play'),reset=document.getElementById('reset');
const joy=document.getElementById('joy'),stick=document.getElementById('stick'),upgradeCard=document.getElementById('upgradeCard');
const el={coins:document.getElementById('coins'),gems:document.getElementById('gems'),chests:document.getElementById('chests'),kills:document.getElementById('kills'),lvl:document.getElementById('levelBadge'),msg:document.getElementById('msg')};
let W=390,H=844,dpr=1,last=0,state='menu',level=1,unlocked=+localStorage.getItem('huntUnlocked')||1;
let player,enemies=[],drops=[],crates=[],trees=[],upgradePads=[],floaters=[],particles=[],cam={x:0,y:0},keys={},joyVec={x:0,y:0},activePointer=null;
let stats={coins:0,gems:0,chests:0,kills:0}; let stageKills=0,targetKills=0,upgradesTaken=0;
const world={w:1800,h:1800};
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);canvas.width=r.width*dpr;canvas.height=r.height*dpr;W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function start(n){level=clamp(n,1,100);ov.style.display='none';state='play';buildStage();updateHud()}
function buildStage(){
 enemies=[];drops=[];crates=[];trees=[];upgradePads=[];floaters=[];particles=[];stageKills=0;upgradesTaken=0;
 player={x:world.w/2,y:world.h/2,r:18,hp:100,maxHp:100,speed:175,damage:26,range:78,spin:0,ifr:0};
 targetKills=18+Math.floor(level*1.8);
 for(let i=0;i<45;i++)trees.push({x:rand(80,world.w-80),y:rand(80,world.h-80),r:rand(18,32)});
 for(let i=0;i<12;i++)crates.push({x:rand(100,world.w-100),y:rand(100,world.h-100),open:false});
 for(let i=0;i<3;i++)upgradePads.push({x:rand(180,world.w-180),y:rand(180,world.h-180),used:false});
 spawnWave(Math.min(targetKills,12));
}
function spawnWave(n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=rand(300,650);let x=clamp(player.x+Math.cos(a)*r,40,world.w-40),y=clamp(player.y+Math.sin(a)*r,40,world.h-40);let tier=1+Math.floor((level-1)/20);enemies.push({x,y,r:16,hp:40+level*4+tier*12,maxHp:40+level*4+tier*12,speed:45+level*.55+rand(0,15),hitCd:0,flash:0})}}
function updateHud(){el.coins.textContent=stats.coins;el.gems.textContent=stats.gems;el.chests.textContent=stats.chests;el.kills.textContent=stats.kills;el.lvl.innerHTML='LV<br>'+level;play.textContent='PLAY LEVEL '+Math.min(unlocked,100)}
function dropLoot(e){if(Math.random()<.9)drops.push({x:e.x,y:e.y,type:'coin',v:rand(0,Math.PI*2)});if(Math.random()<.11)drops.push({x:e.x+10,y:e.y,type:'gem',v:0})}
function damageEnemy(e,amt){if(e.hitCd>0)return;e.hitCd=.22;e.hp-=amt;e.flash=.08;floaters.push({x:e.x,y:e.y-20,text:Math.round(amt),life:.6});if(e.hp<=0){stageKills++;stats.kills++;dropLoot(e);e.dead=true;if(stageKills<targetKills&&enemies.filter(v=>!v.dead).length<7)spawnWave(Math.min(6,targetKills-stageKills));if(stageKills>=targetKills)clearStage()}}
function clearStage(){state='clear';el.msg.style.opacity=1;setTimeout(()=>{el.msg.style.opacity=0;if(level===unlocked&&unlocked<101){unlocked=level+1;localStorage.setItem('huntUnlocked',unlocked)}if(level>=100){showEnd()}else start(level+1)},900)}
function showEnd(){state='menu';ov.style.display='grid';ov.querySelector('.title').innerHTML='YOU<br><span style="color:#77e69a">MADE IT</span>';ov.querySelector('.sub').textContent='All 100 levels cleared.';play.textContent='PLAY AGAIN';play.onclick=()=>start(1)}
function defeat(){state='dead';setTimeout(()=>{ov.style.display='grid';ov.querySelector('.title').innerHTML='<span style="color:#e85b63">DEFEATED</span>';ov.querySelector('.sub').innerHTML='Rewards collected: <b>'+stats.coins+' coins</b>, <b>'+stats.gems+' gems</b>, <b>'+stats.chests+' chests</b>.';play.textContent='RETRY LEVEL '+level;play.onclick=()=>start(level)},350)}
function chooseUpgrade(type){if(type==='damage')player.damage*=1.25;if(type==='range')player.range*=1.2;if(type==='speed')player.speed*=1.15;upgradeCard.style.display='none';state='play'}
upgradeCard.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>chooseUpgrade(b.dataset.up));
function interactPads(){for(const u of upgradePads){if(!u.used&&dist(player,u)<46){u.used=true;upgradesTaken++;state='upgrade';upgradeCard.style.display='block';break}}}
function update(dt){
 if(state!=='play')return;
 let vx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),vy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);vx+=joyVec.x;vy+=joyVec.y;let m=Math.hypot(vx,vy)||1;vx/=m;vy/=m;
 player.x=clamp(player.x+vx*player.speed*dt,30,world.w-30);player.y=clamp(player.y+vy*player.speed*dt,30,world.h-30);player.spin+=dt*5.8;player.ifr=Math.max(0,player.ifr-dt);
 for(const e of enemies){if(e.dead)continue;e.hitCd=Math.max(0,e.hitCd-dt);e.flash=Math.max(0,e.flash-dt);let dx=player.x-e.x,dy=player.y-e.y,dm=Math.hypot(dx,dy)||1;e.x+=dx/dm*e.speed*dt;e.y+=dy/dm*e.speed*dt;if(dm<player.range+e.r)damageEnemy(e,player.damage);if(dm<player.r+e.r+2&&player.ifr<=0){player.hp-=10+level*.12;player.ifr=.5;if(player.hp<=0)defeat()}}
 enemies=enemies.filter(e=>!e.dead);
 for(const d of drops){let dd=dist(player,d);if(dd<120){d.x+=(player.x-d.x)*dt*5;d.y+=(player.y-d.y)*dt*5}if(dd<24){if(d.type==='coin')stats.coins+=10;else stats.gems++;d.dead=true}}
 drops=drops.filter(d=>!d.dead);
 for(const c of crates){if(!c.open&&dist(player,c)<28){c.open=true;stats.chests++;stats.coins+=30;particles.push({x:c.x,y:c.y,life:.7})}}
 interactPads();
 for(const f of floaters){f.y-=24*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);for(const p of particles)p.life-=dt;particles=particles.filter(p=>p.life>0);
 cam.x+=(clamp(player.x-W/2,0,world.w-W)-cam.x)*Math.min(1,dt*7);cam.y+=(clamp(player.y-H/2,0,world.h-H)-cam.y)*Math.min(1,dt*7);updateHud()
}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function draw(){
 ctx.fillStyle='#173321';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 for(let gx=0;gx<world.w;gx+=90)for(let gy=0;gy<world.h;gy+=90){ctx.fillStyle=((gx+gy)/90)%2?'#183823':'#16331f';ctx.fillRect(gx,gy,90,90)}
 for(const t of trees){ctx.fillStyle='#0d2216';circle(t.x+5,t.y+10,t.r,'#0d2216');circle(t.x,t.y,t.r,'#275d36');circle(t.x-10,t.y+4,t.r*.65,'#2f6b40')}
 for(const c of crates){ctx.fillStyle=c.open?'#6f5530':'#8b6635';ctx.fillRect(c.x-15,c.y-15,30,30);ctx.strokeStyle='#35240f';ctx.strokeRect(c.x-15,c.y-15,30,30)}
 for(const u of upgradePads){if(u.used)continue;let pulse=1+Math.sin(performance.now()/250)*.08;ctx.save();ctx.translate(u.x,u.y);ctx.scale(pulse,pulse);circle(0,0,34,'#ffbc3d33');circle(0,0,23,'#ffb22f55');ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText('Upgrade',0,-42);ctx.restore()}
 for(const d of drops){ctx.font='18px system-ui';ctx.fillText(d.type==='coin'?'🪙':'💎',d.x-9,d.y+7)}
 for(const e of enemies){if(e.dead)continue;circle(e.x,e.y,e.r+3,'#0005');circle(e.x,e.y,e.r,e.flash>0?'#fff':'#6f3b2f');ctx.fillStyle='#2c1915';ctx.fillRect(e.x-4,e.y-5,3,3);ctx.fillRect(e.x+3,e.y-5,3,3);ctx.fillStyle='#3d1111';ctx.fillRect(e.x-17,e.y-25,34,4);ctx.fillStyle='#d95949';ctx.fillRect(e.x-17,e.y-25,34*Math.max(0,e.hp/e.maxHp),4)}
 // player
 circle(player.x,player.y,player.r+8,'#ffffff0d');circle(player.x,player.y,player.r,'#b68a46');ctx.fillStyle='#f0d19a';ctx.fillRect(player.x-8,player.y-17,16,12);ctx.fillStyle='#4a2c13';ctx.fillRect(player.x-12,player.y-18,24,6);
 // spinning weapon
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.spin);ctx.strokeStyle='#cfd7d5aa';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,player.range*.72,0,Math.PI*1.5);ctx.stroke();for(let i=0;i<3;i++){let a=i*Math.PI*2/3;ctx.save();ctx.rotate(a);ctx.translate(player.range*.72,0);ctx.rotate(.75);ctx.fillStyle='#dfe8e5';ctx.fillRect(-4,-3,42,7);ctx.fillStyle='#765936';ctx.fillRect(-13,-4,12,9);ctx.restore()}ctx.restore();
 // hp
 ctx.fillStyle='#0008';ctx.fillRect(player.x-28,player.y-38,56,6);ctx.fillStyle='#57d46b';ctx.fillRect(player.x-28,player.y-38,56*(player.hp/player.maxHp),6);
 for(const f of floaters){ctx.globalAlpha=f.life/.6;ctx.fillStyle='#fff';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;
 ctx.restore();
 // vignette
 let g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#000b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function loop(ts){let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.code]=true});addEventListener('keyup',e=>{keys[e.code]=false});
canvas.addEventListener('pointerdown',e=>{activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);moveJoy(e)});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)moveJoy(e)});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===activePointer){activePointer=null;joyVec={x:0,y:0};stick.style.transform='translate(0,0)'}});
function moveJoy(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,max=26;if(m>max){dx=dx/m*max;dy=dy/m*max}joyVec={x:dx/max,y:dy/max};stick.style.transform='translate('+dx+'px,'+dy+'px)'}
play.onclick=()=>start(Math.min(unlocked,100));reset.onclick=()=>{localStorage.removeItem('huntUnlocked');unlocked=1;stats={coins:0,gems:0,chests:0,kills:0};updateHud();play.textContent='PLAY LEVEL 1'};
updateHud();buildStage();
})();
</script>
</body>
</html>
